<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title or "Travel Karo" }}</title>
  <meta name="description" content="{{ meta_description or 'Travel Karo — a family-owned, IRCTC-authorised, GST-registered travel agency in Bathinda.' }}" />
  <link rel="icon" href="/static/img/logo-emblem.jpg" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page_title or 'Travel Karo' }}" />
  <meta property="og:description" content="{{ meta_description or 'Travel Karo — Let’s make memories.' }}" />
  <meta property="og:image" content="{{ site_url }}/static/img/logo-emblem.jpg" />
  <meta property="og:site_name" content="Travel Karo" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/public.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TravelAgency",
    "name": "Travel Karo",
    "image": "{{ site_url }}/static/img/logo-emblem.jpg",
    "telephone": "{{ biz.phone }}",
    "email": "{{ biz.email }}",
    "url": "{{ site_url }}",
    "slogan": "Let's Make Memories.",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "#4910, Post Office Bazar",
      "addressLocality": "Bathinda",
      "addressRegion": "Punjab",
      "postalCode": "151005",
      "addressCountry": "IN"
    }
  }
  </script>
</head>
<body>
  {% set wa_number = (biz.phone or '') | replace(' ','') | replace('+','') | replace('-','') %}
  {% include "partials/nav.html" %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}

  <a class="wa-float" data-track="whatsapp" href="https://wa.me/{{ wa_number }}?text=Hi%20Travel%20Karo,%20I'd%20like%20to%20plan%20a%20trip." target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.82 9.82 0 001.611 5.367l-.999 3.648 3.886-1.314z"/></svg>
  </a>

  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
